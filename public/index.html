<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141b">
    <title>Mediapp — Download activity</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Mediapp home">
          <span class="brand-mark" aria-hidden="true">m</span>
          <span>mediapp</span>
        </a>
        <div class="topbar-right">
          <span class="refresh-label"><span class="live-dot"></span> Live from your services</span>
          <button class="refresh-button" id="refresh-button" type="button">
            <span aria-hidden="true">↻</span> Refresh
          </button>
        </div>
      </header>

      <section class="intro">
        <p class="eyebrow">YOUR MEDIA SERVERS</p>
        <div class="intro-row">
          <div>
            <h1>Download activity</h1>
            <p class="intro-copy">A clear view of what's downloading and what just arrived.</p>
          </div>
          <p class="updated" id="updated-at">Connecting…</p>
        </div>
      </section>

      <section class="service-grid" id="service-grid" aria-label="Service status"></section>
      <section class="activity-panel">
        <div class="activity-heading">
          <div>
            <p class="eyebrow">WHAT'S HAPPENING</p>
            <h2>Recent activity</h2>
          </div>
          <span class="source-note">From Sonarr &amp; Radarr history</span>
        </div>
        <div id="activity-list" class="activity-list"></div>
      </section>
      <footer>
        <span>Mediapp</span>
        <span>Queue and history provided by Sonarr &amp; Radarr</span>
      </footer>
    </main>
    <div id="live-region" class="visually-hidden" aria-live="polite"></div>
  </body>
</html>
